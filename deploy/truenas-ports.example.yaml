#
# Required TrueNAS ix-app settings for headless-chrome.
# Copy these blocks into your iX App user_config.yaml.

# DNS (LAN only — matches deploy/defaults.env; avoids public DNS popups/ads):
"dns_config":
  "nameservers":
    - "192.168.1.200"
  "options":
    - "name": "ndots"
      "value": "2"
  "searches": []

"ports":
  - "bind_mode": "published"
    "container_port": 6080
    "host_ips": []
    "port_number": 6080
    "protocol": "tcp"

# Optional portal (TrueNAS Apps UI shortcut):
"portals":
  - "name": "Web UI"
    "path": "/"
    "port": 6080
    "scheme": "http"
    "use_node_ip": true
